<html lang="en">
  <head>

    <title>Playground</title>
  </head>
  <body>
    <form id="nota">
      <label>Introduce la nota</label>

    <form id="adivina">
      <label id="label-adivina"

      <input type="number" />
      <button class="btn">Di nota</button>
      <p id="result-adivina"></p>
    </form>
  </body>
  <script type="module" src="./js/index.js"></script>
